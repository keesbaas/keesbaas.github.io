<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Videos</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
</head>

<body>

<header>
  <h1>Just some data</h1>
  <a href="index.html" class="fade-link">back</a>
</header>

<div class="album-container">

  <div class="video-intro">
    Turns out you can download your entire Spotify listening history. So here's how I listened to muscic between 2012 and 2025. Don't judge too hard for how long Imagine Dragons was up there. Or the Kanye resurgence. 
  </div>

  <div class="video-grid">

    <div class="video-block">
      <video controls>
        <source src="images\SpotifyTopTenArtists.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

    <div class="video-block">
      <video controls>
        <source src="images\SpotifyTopTenSongs.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

  </div>

</div>

<div class="chart-container">
  <canvas id="artistChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
fetch("https://keesbaas.github.io/music_things/artist_30day_summary.json")
  .then(response => response.json())
  .then(data => {

    // Sort descending by minutes
    data.sort((a, b) => b.minutes - a.minutes);
    const top10 = data.slice(0, 10);

    // Compute total minutes
    const totalMinutes = data.reduce((sum, artist) => sum + artist.minutes, 0);

    // Prepare labels and percentage values
    const labels = top10.map(a => a.artist);
    const percentages = top10.map(a => +( (a.minutes / totalMinutes) * 100 ).toFixed(1));

    new Chart(document.getElementById("artistChart"), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: "% of Total Listening Time",
          data: percentages,
          backgroundColor: 'rgba(0, 220, 255, 0.8)', // neon-style color that pops on black
          borderRadius: 6,
          barPercentage: 0.6,       // controls thickness of bars (less = more spacing)
          categoryPercentage: 0.7   // controls spacing between categories
        }]
      },
      options: {
        indexAxis: 'y',             // horizontal bars
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: 10
        },
        scales: {
          x: {
            beginAtZero: true,
            max: 100,
            grid: {
              display: false       // removes vertical grid lines
            },
            ticks: {
              color: '#fff',      // x-axis numbers white
              callback: value => value + "%" // show % sign
            }
          },
          y: {
            grid: {
              display: false       // removes horizontal grid lines
            },
            ticks: {
              color: '#fff',       // artist names in white
              font: {
                size: 14
              }
            }
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: '#222',
            titleColor: '#fff',
            bodyColor: '#fff',
            callbacks: {
              label: function(context) {
                return context.parsed.x + "% (" + top10[context.dataIndex].minutes.toFixed(1) + " min)";
              }
            }
          }
        }
      }
    });

  });
</script>
  
</body>
</html>
