<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Videos</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
</head>

<body>

<header>
  <h1>Just some data</h1>
  <a href="index.html" class="fade-link">back</a>
</header>

<div class="album-container">

  <div class="video-intro">
    Turns out you can download your entire Spotify listening history. So here's how I listened to muscic between 2012 and 2025. Don't judge too hard for how long Imagine Dragons was up there. Or the Kanye resurgence. 
  </div>

  <div class="video-grid">

    <div class="video-block">
      <video controls>
        <source src="images\SpotifyTopTenArtists.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

    <div class="video-block">
      <video controls>
        <source src="images\SpotifyTopTenSongs.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

  </div>

</div>

<div class="chart-container">
  <canvas id="artistChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
fetch("https://keesbaas.github.io/music_things/artist_30day_summary.json")
  .then(response => response.json())
  .then(data => {

    // Sort descending by minutes
    data.sort((a, b) => b.minutes - a.minutes);

    // Take top 10
    const top10 = data.slice(0, 10);

    // Compute total minutes
    const totalMinutes = data.reduce((sum, artist) => sum + artist.minutes, 0);

    // Convert to percentage
    const labels = top10.map(a => a.artist);
    const percentages = top10.map(a => 
        ((a.minutes / totalMinutes) * 100).toFixed(1)
    );
    
      new Chart(document.getElementById("artistChart"), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: "% of Total Listening Time",
      data: percentages,
      backgroundColor: 'rgba(75, 192, 192, 0.7)',
      borderColor: 'rgba(75, 192, 192, 1)',
      borderWidth: 1,
      borderRadius: 5       // slightly rounded edges
    }]
  },
  options: {
    indexAxis: 'y',         // <-- makes it horizontal
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: {
        beginAtZero: true,
        max: 100,
        ticks: {
          callback: value => value + "%"  // show percentages on x-axis
        }
      },
      y: {
        ticks: {
          autoSkip: false, // show all artist labels
          font: {
            size: 14
          }
        }
      }
    },
    plugins: {
      legend: {
        display: false
      },
      tooltip: {
        callbacks: {
          label: function(context) {
            return context.parsed.x + "% (" + top10[context.dataIndex].minutes.toFixed(1) + " min)";
          }
        }
      }
    }
  }
});
    

  });
</script>
  
</body>
</html>
