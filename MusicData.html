<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>music</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
</head>

<body>

<header>
  <h1>Just some data</h1>
  <a href="index.html" class="fade-link">back</a>
</header>

<div class="album-container">

  <div class="video-intro">
    Don't judge too hard for how long Imagine Dragons was up there. Or the Kanye resurgence. Also, the graph at the bottom is more real-time listening updated every hour.  
  </div>

  <div class="video-grid">

    <div class="video-block">
      <video controls>
        <source src="images\Keeeees2025SpotifyTopTen.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

    <div class="video-block">
      <video controls>
        <source src="images\KeesSpotifyTopTenAll.mp4" type="video/mp4">
      </video>
      <div class="video-caption">
        
      </div>
    </div>

  </div>

</div>

<div class="chart-container">
  <div class="chart-header">
    <span>Total Minutes (Last 30 Days): <span id="minutes30"></span></span>
  </div>
  <canvas id="artistChart30"></canvas>
</div>

<div class="chart-container">
  <div class="chart-header">
    <span>Total Minutes (All Time): <span id="minutesAll"></span></span>
  </div>
  <canvas id="artistChartAll"></canvas>
</div>

  
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
fetch("https://keesbaas.github.io/music_things/artist_30day_summary.json")
  .then(response => response.json())
  .then(data => {

    // Sort descending by minutes
    data.sort((a, b) => b.minutes - a.minutes);
    const top10 = data.slice(0, 10);

    // Compute total minutes
    const totalMinutes = data.reduce((sum, artist) => sum + artist.minutes, 0);

    const labels = top10.map(a => a.artist);
    const percentages = top10.map(a => +((a.minutes / totalMinutes) * 100).toFixed(1));

    // Determine max X dynamically (slightly above highest percentage)
    const maxX = Math.ceil(Math.max(...percentages) / 10) * 10 + 10;

    new Chart(document.getElementById("artistChart"), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: "% of Total Listening Time",
          data: percentages,
          backgroundColor: 'rgba(0, 220, 255, 0.8)',
          borderRadius: 6,
          barPercentage: 0.7,
          categoryPercentage: 0.7
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: 12 },
        scales: {
          x: {
            beginAtZero: true,
            max: maxX,                     // dynamic scale
            title: {
              display: true,
              text: 'Percentage of Total Listening (Last 30 days)',
              color: '#fff',
              font: { size: 14 }
            },
            grid: { display: false },
            ticks: {
              color: '#fff',
              callback: value => value + '%'
            }
          },
          y: {
            grid: { display: false },
            ticks: {
              color: '#fff',
              font: { size: 14 },
              autoSkip: false               // force all labels to show
            }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#222',
            titleColor: '#fff',
            bodyColor: '#fff',
            callbacks: {
              label: function(context) {
                return context.parsed.x + "% (" + top10[context.dataIndex].minutes.toFixed(1) + " min)";
              }
            }
          }
        }
      }
    });

  });
</script>
  
</body>
</html>
